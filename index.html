<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Coding</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
   href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
   rel="stylesheet"
  />
 </head>
 <body>
  <section class="card-wrapper">
   <div class="wrapper">
    <input type="checkbox" id="button" hidden />
    <label class="btn-wrapper" for="button">
     <button class="btn-wrapper__add-btn">Add Item</button>
     <button class="btn-wrapper__clear-btn">Clear</button>
    </label>
    <button class="toggle-btn">Toggle Cards</button>

    <div class="card-desc">
     <input
      class="card-input"
      type="address"
      name="ip"
      id="address"
      placeholder="158.143.37.141"
     />
     <div class="content">
      <label for="address" class="card">IP Address</label>
      <img src="./assets/x.svg" alt="Close Icon" class="icon" />
     </div>
    </div>

    <div class="card-desc">
     <input
      class="card-input"
      type="address"
      name="ip"
      id="address"
      placeholder="109.172.128.0"
     />
     <div class="content">
      <label for="address" class="card">IP Address</label>
      <img src="./assets/x.svg" alt="Close Icon" class="icon" />
     </div>
    </div>

    <div class="card-desc">
     <input
      class="card-input"
      type="address"
      name="ip"
      id="address"
      placeholder="8.8.8.8"
     />
     <div class="content">
      <label for="address" class="card">IP Address</label>
      <img src="./assets/x.svg" alt="Close Icon" class="icon" />
     </div>
    </div>
   </div>
  </section>
 </body>
</html>
